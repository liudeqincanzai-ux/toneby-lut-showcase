<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Toneby LUT Showcase</title>
  <link rel="stylesheet" href="styles.css?v=20260911b">
</head>
<body>
  <!-- 顶部大标题 + 小字（可在编辑器里随时修改） -->
  <section class="hero">
    <h1 id="siteTitle">Toneby LUT Showcase</h1>
    <p id="siteSubtitle">Explore the colors of Toneby.</p>
  </section>

  <!-- 顶部：选择全部 LUT 的下拉部件（访客视角，无编辑入口） -->
  <header class="topbar">
    <div class="picker-wrap">
      <select id="groupPicker" aria-label="选择 LUT 分组"></select>
      <span class="picker-arrow" aria-hidden="true">▾</span>
    </div>
  </header>

  <!-- 当前分组的 LUT 列表：一格一个，从上往下 -->
  <main id="page"></main>

  <script src="data.js?v=20260911b"></script>
  <script src="main.js?v=20260911b"></script>
</body>
</html>
