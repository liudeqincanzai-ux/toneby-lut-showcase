<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>内容编辑器 · Toneby LUT</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- 密码门：访客不可见后台 -->
  <div id="gate" class="gate">
    <div class="gate-box">
      <h1>内容编辑器</h1>
      <p class="gate-hint">请输入管理密码进入</p>
      <input id="gatePass" type="password" autocomplete="current-password">
      <button id="gateBtn" type="button">进入</button>
      <p id="gateErr" class="gate-err"></p>
      <a class="bar-link" href="index.html">← 返回预览</a>
    </div>
  </div>

  <!-- 编辑器主体（密码通过后显示） -->
  <div id="app" style="display:none">
    <header class="edit-bar">
      <a class="bar-link" href="index.html">← 返回预览</a>
      <span class="bar-title">内容编辑器</span>
      <span class="bar-actions">
        <span id="syncStatus" class="sync-status"></span>
        <button id="btnSync" type="button" class="primary">保存并同步到网站</button>
        <button id="btnExport" type="button" class="ghost">导出 data.js</button>
        <button id="btnReset" type="button" class="ghost">恢复默认</button>
      </span>
    </header>
    <div class="edit-layout">
      <nav id="lutList" class="lut-list"></nav>
      <div id="editor" class="editor-pane"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="data.js"></script>
  <script src="editor.js"></script>
</body>
</html>
